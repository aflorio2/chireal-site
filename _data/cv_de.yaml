# Deutsche Übersetzung von cv.yaml — von Hand gepflegt, nicht durch fetch-data.sh überschrieben.
# Struktur exakt parallel zu cv.yaml. Wenn cv.yaml inhaltlich aktualisiert wird,
# muss diese Datei manuell nachgezogen werden.
#
# Konvention:
#   - Event- und Vortragstitel (selected_talks/talks: event, title, location, event_detail)
#     bleiben in der Originalsprache.
#   - Kategorische Typen (type) bleiben Englisch, weil sie als Filter-Schlüssel im
#     Layout dienen ({% if talk.type == "Plenary talk" %} usw.).
#   - Eigennamen (Stipendien, Preise, Workshop-Reihen) bleiben erhalten, umschließende
#     Prosa wird übersetzt.

