# Emmy Noether Grant
- title: Emmy Noether Research Group
  subtitle: "From classical to quantum simulations of chiral anomaly dynamics"
  group: featured
  image: images/projects/emmy-noether-grant.png
  link: https://gepris.dfg.de/gepris/projekt/545261797?language=en
  description: >
    DFG-funded junior research group investigating anomalous
    transport effects on topology-changing processes in the Standard Model.
    Combines classical statistical methods to the study of the real-time quantum
    dynamics of low-dimensional systems.
  description_de: >
    Von der DFG geförderte Nachwuchsgruppe, die anomale Transporteffekte
    bei topologieändernden Prozessen im Standardmodell untersucht. Verbindet
    klassisch-statistische Methoden mit der Untersuchung der Echtzeit-Quantendynamik
    niederdimensionaler Systeme.
  tags:
    - research-program

# CosmoLattice Software
- title: CosmoLattice
  subtitle: Lattice simulations of field dynamics in expanding universe
  group: featured
  image: images/projects/cosmolattice-simulation.png
  link: https://cosmolattice.net
  description: >
    Modern software package for lattice simulations of field dynamics in an
    expanding universe. Supports interacting scalar field theories, Abelian U(1)
    and non-Abelian SU(2) gauge theories in an expanding universe, including
    gravitational waves production. De facto community standard, actively
    developed and [open source](https://github.com/cosmolattice/cosmolattice).
  description_de: >
    Modernes Softwarepaket für Gittersimulationen von Felddynamik in einem
    expandierenden Universum. Unterstützt wechselwirkende skalare Feldtheorien
    sowie abelsche U(1)- und nichtabelsche SU(2)-Eichtheorien in einem expandierenden
    Universum, einschließlich der Erzeugung von Gravitationswellen. De-facto-Standard
    in der Community, aktiv weiterentwickelt und [Open Source](https://github.com/cosmolattice/cosmolattice).
  repo: cosmolattice/CosmoLattice
  tags:
    - software

# CRC-TR 211 Project A02
- title: "CRC-TR 211: Strong-Interaction Matter"
  subtitle: "Project A02: Lattice QCD at non-vanishing density"
  group: featured
  image: images/projects/crc-tr211-collaboration.png
  link: https://crc-tr211.org/
  description: >
    Collaborative Research Centre (partners: Bielefeld, Darmstadt, Gießen and
    Frankfurt universities) studying strong-interaction matter under extreme
    conditions. Project A02 explores the QCD phase diagram using quantum
    information measures, quantum computations and effective field theories.
  description_de: >
    Sonderforschungsbereich (Partner: Universitäten Bielefeld, Darmstadt,
    Gießen und Frankfurt), der stark wechselwirkende Materie unter extremen
    Bedingungen untersucht. Projekt A02 erforscht das QCD-Phasendiagramm
    mithilfe quanteninformationstheoretischer Maße, Quantenberechnungen und
    effektiver Feldtheorien.
  tags:
    - research-program
    - collaboration

# ALPS - Advanced Lectures in Physics in Switzerland
- title: Advanced Lectures in Physics in Switzerland (ALPS)
  subtitle: PhD summer school by juniors for juniors
  group: featured
  image: images/projects/alps-summer-school.jpg
  link: https://indico.global/event/9670/
  description: >
    A junior school in theoretical physics held annually in the Swiss Alps,
    designed to foster collaboration among young researchers through lectures
    given by rising stars in different areas of modern theoretical physics.
    Topics include quantum information theory, quantum computing, entanglement
    in QFT, and holography. The third edition took place in May 2026.
    Links to past editions: [ALPS I](https://indico.global/event/9618/),
    [ALPS II](https://indico.global/event/9641/),
    [ALPS III](https://indico.global/event/9670/).
  description_de: >
    Eine jährlich in den Schweizer Alpen stattfindende Sommerschule für
    Nachwuchsforschende in der theoretischen Physik. Sie soll den Austausch unter
    jungen Forschenden durch Vorlesungen aufstrebender Wissenschaftler:innen aus
    verschiedenen Gebieten der modernen theoretischen Physik fördern. Themen
    umfassen Quanteninformationstheorie, Quantencomputing, Verschränkung in der
    Quantenfeldtheorie und Holographie. Die dritte Ausgabe fand im Mai 2026 statt.
    Links zu früheren Ausgaben: [ALPS I](https://indico.global/event/9618/),
    [ALPS II](https://indico.global/event/9641/),
    [ALPS III](https://indico.global/event/9670/).
  tags:
    - education
    - collaboration
