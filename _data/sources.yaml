# Featured publications with custom highlight images
- id: doi:10.1103/q386-v4ch
  highlight: true
  image: images/publications_highlights/asymmetry.png
  description: >
    We consider the entanglement asymmetry as a symmetry probe in gauge theories.
    We compute it analytically in the massless Schwinger model and show it to be
    parametrically more sensitive to symmetry breaking/restoration than the
    corresponding local order parameter for the chiral symmetry.
  description_de: >
    Wir untersuchen die Verschränkungs-Asymmetrie als Sonde für Symmetrien in
    Eichtheorien. Wir berechnen sie analytisch im masselosen Schwinger-Modell und
    zeigen, dass sie parametrisch empfindlicher auf Symmetriebrechung und
    -wiederherstellung reagiert als der entsprechende lokale Ordnungsparameter
    der chiralen Symmetrie.

- id: doi:10.1103/sgrx-jpp9
  highlight: true
  image: images/publications_highlights/thermalization_quantum_entanglement.png
  description: >
    This work demonstrates how quantum entanglement drives thermalization in
    jet-like excitations within the massive Schwinger model. Using tensor
    network simulations of real-time evolution, we show that entanglement
    generation provides a microscopic mechanism for thermalization in this strongly
    interacting gauge theory.
  description_de: >
    Diese Arbeit zeigt, wie Quantenverschränkung die Thermalisierung jetartiger
    Anregungen im massiven Schwinger-Modell antreibt. Mithilfe von
    Tensornetzwerk-Simulationen der Echtzeitentwicklung weisen wir nach, dass die
    Erzeugung von Verschränkung einen mikroskopischen Mechanismus für die
    Thermalisierung in dieser stark wechselwirkenden Eichtheorie liefert.

- id: doi:10.1103/PhysRevD.109.L071501
  highlight: true
  image: images/publications_highlights/negativitynew3.png
  description: >
    We establish that the two-fermion negativity, a particular measure of
    multipartite entanglement, detects confinement in the massive Schwinger model.
    This reinforces the intuition that quantum correlations are sensitive to the
    confinement/deconfinement transition.
  description_de: >
    Wir zeigen, dass die Zwei-Fermion-Negativität – ein spezielles Maß für
    mehrteilige Verschränkung – Confinement im massiven Schwinger-Modell
    nachweist. Dies bestärkt die Intuition, dass Quantenkorrelationen empfindlich
    auf den Confinement-Deconfinement-Übergang reagieren.

- id: doi:10.21468/SciPostPhys.17.3.085
  highlight: true
  image: images/publications_highlights/higher_forms.png
  description: >
    Higher-form symmetries can be used to constrain the long-range dynamics of
    interacting systems. Magneto-hydrodynamics can be derived from the conservation
    of magnetic lines and chiral transport emerges from the presence of a non-invertible
    symmetry. We demonstrate the practicality of these ideas in classical-statistical
    simulations, where we compute the predicted transports from first principles.
  description_de: >
    Höhere Formsymmetrien lassen sich nutzen, um die Langzeitdynamik wechselwirkender
    Systeme einzuschränken. Magnetohydrodynamik kann aus der Erhaltung magnetischer
    Feldlinien abgeleitet werden, und chiraler Transport entsteht in Gegenwart einer
    nichtinvertierbaren Symmetrie. Wir demonstrieren die praktische Anwendbarkeit
    dieser Ideen in klassisch-statistischen Simulationen, in denen wir die
    vorhergesagten Transportgrößen aus ersten Prinzipien berechnen.
